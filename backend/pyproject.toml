[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CommitFuture"
version = "0.1.0"
description = "AI powered CV matching system"
requires-python = ">=3.11"

dependencies = [
    # Web & Framework
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "aiofiles",
    # Document Processing & OCR
    "pdfplumber",
    "pymupdf",
    "pytesseract",
    "pillow",
    "pdf2image",
    "python-magic-bin; sys_platform == 'win32'",
    "python-magic; sys_platform != 'win32'",
    # DB & ORM
    "sqlmodel>=0.0.22",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    # Text & Utils
    "ftfy",
    "regex",
    "phonenumbers",
    "dateparser",
    "flashtext",
    "httpx",
    "loguru",
]

[project.optional-dependencies]
dev = [
    # Static Analysis & Quality Stack
    "ruff",
    "mypy",
    "pylint",
    "bandit",
    "pre-commit",
    # Type Stubs (Mypy Support)
    "types-dateparser",
    "types-aiofiles",
    "types-pillow",
    # Testing & DB Validation
    "pytest",
    "pytest-dotenv",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "testcontainers[postgres]",
    "freezegun",
    "schemathesis",
    "deepdiff",
    "deepeval",
    # Docs
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["logs*", "uploads*", "storage*", "tests*"]
