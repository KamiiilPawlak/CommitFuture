services:
  postgres:
    image: postgres:16-alpine
    container_name: CommitFuture-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abcd1234
      POSTGRES_DB: cv_ai_matcher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: CommitFuture-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - DATABASE_URL=postgresql+psycopg2://postgres:abcd1234@postgres:5432/cv_ai_matcher
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: CommitFuture-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

  mkdocs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    container_name: cv-ai-matcher-docs
    ports:
      - "8001:8000"
    volumes:
      - .:/docs
    command: mkdocs serve --dev-addr 0.0.0.0:8000

volumes:
  postgres_data:
