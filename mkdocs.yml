site_name: CV AI Matcher - Dokumentacja Systemu

theme:
  name: material
  language: pl
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["backend"]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Strona Główna: index.md
  - Architektura:
      - Decyzje (ADR): architecture/adr/0001-magic-bytes-validation.md
      - Bezpieczeństwo: architecture/security_policies.md
      - Integracja z LLM (zarchiwizowane): architecture/llm-integration-archived.md
  - Instrukcje:
      - Lokalne Uruchomienie: how-to/local_development.md
      - Testowanie: how-to/testing.md
  - Dokumentacja Kodu (API):
      - Punkty Końcowe (Endpoints): reference/api_endpoints.md
      - Moduł Ingestion: reference/ingestion_services.md
      - ETL CV: reference/etl_cv_services.md
